openapi: 3.0.3
info:
  title: StreetHoops API
  version: 1.0.0
  description: |
    API приложения StreetHoops: карта уличных баскетбольных площадок,
    отметки «Буду сегодня» и вкладка «Тренировки» с рейтингом тренеров.
    Защищённые методы требуют заголовок `Authorization: Bearer <JWT>`.
servers:
  - url: https://api.streethoops.example.com/v1
    description: Production
  - url: http://localhost:8000/v1
    description: Локальная разработка

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация игрока
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход, получение JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /courts:
    get:
      tags: [Courts]
      summary: Список площадок с фильтрами
      security: []
      parameters:
        - name: surface_type
          in: query
          description: Тип покрытия
          schema: { $ref: '#/components/schemas/SurfaceType' }
        - name: is_paid
          in: query
          description: true - платные, false - бесплатные
          schema: { type: boolean }
        - name: has_lighting
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Список площадок
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CourtPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Courts]
      summary: Добавить площадку (уходит на модерацию)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourtCreate' }
      responses:
        '201':
          description: Площадка создана со статусом pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourtPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /courts/{courtId}:
    get:
      tags: [Courts]
      summary: Карточка площадки
      security: []
      parameters:
        - $ref: '#/components/parameters/CourtId'
      responses:
        '200':
          description: Данные площадки и счётчик ожидаемых игроков
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourtPublic' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courts/{courtId}/checkins:
    post:
      tags: [Check-ins]
      summary: Отметиться «Буду сегодня»
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourtId'
      responses:
        '201':
          description: Отметка создана, счётчик площадки увеличен на 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /checkins/{checkinId}:
    patch:
      tags: [Check-ins]
      summary: Изменить статус отметки («Не смогу»)
      security:
        - bearerAuth: []
      parameters:
        - name: checkinId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckinUpdate' }
      responses:
        '200':
          description: Статус обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trainers:
    get:
      tags: [Trainers]
      summary: Список тренеров (вкладка «Тренировки»)
      security: []
      parameters:
        - name: specialization
          in: query
          schema: { type: string }
        - name: min_rating
          in: query
          schema: { type: number, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: Список активных тренеров
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrainerPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Trainers]
      summary: Предложить услуги тренера (создать профиль)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainerCreate' }
      responses:
        '201':
          description: Профиль тренера создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainerPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /trainers/{trainerId}/ratings:
    post:
      tags: [Trainers]
      summary: Оценить тренера (1-5)
      description: Нельзя оценить себя (403) и оценить дважды (409).
      security:
        - bearerAuth: []
      parameters:
        - name: trainerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainerRatingCreate' }
      responses:
        '201':
          description: Оценка добавлена, средний рейтинг пересчитан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainerRatingPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CourtId:
      name: courtId
      in: path
      required: true
      description: Идентификатор площадки
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Не авторизован (нет или неверный токен)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Дубликат записи
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: validation_error }
        message: { type: string, example: Поле score должно быть от 1 до 5 }

    SurfaceType:
      type: string
      enum: [asphalt, rubber, parquet]

    # ---- User
    UserCreate:
      type: object
      description: Регистрация. Нужен email или телефон.
      required: [name, password]
      anyOf:
        - required: [email]
        - required: [phone]
      properties:
        name: { type: string, minLength: 2, example: Дмитрий }
        email: { type: string, format: email }
        phone: { type: string, example: '+79991234567' }
        password: { type: string, format: password, minLength: 8, writeOnly: true }

    UserPublic:
      type: object
      description: Данные пользователя без пароля
      required: [user_id, name, role]
      properties:
        user_id: { type: integer, readOnly: true }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [player, admin] }
        registration_date: { type: string, format: date-time, readOnly: true }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, description: Email или телефон }
        password: { type: string, format: password, writeOnly: true }

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }

    # ---- Court
    CourtCreate:
      type: object
      required: [address, latitude, longitude, surface_type, has_lighting, is_paid]
      properties:
        address: { type: string, example: 'Москва, ул. Профсоюзная, 12' }
        latitude: { type: number, format: float, minimum: -90, maximum: 90 }
        longitude: { type: number, format: float, minimum: -180, maximum: 180 }
        surface_type: { $ref: '#/components/schemas/SurfaceType' }
        has_lighting: { type: boolean }
        is_paid: { type: boolean }

    CourtPublic:
      allOf:
        - $ref: '#/components/schemas/CourtCreate'
        - type: object
          required: [court_id, moderation_status]
          properties:
            court_id: { type: integer, readOnly: true }
            photo_url: { type: string, format: uri, nullable: true }
            moderation_status: { type: string, enum: [pending, approved, rejected] }
            expected_players_today:
              type: integer
              readOnly: true
              description: Число отметок «Буду сегодня» на сегодня

    # ---- Check-in
    CheckinUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: ['Буду сегодня', 'Не смогу'] }

    CheckinPublic:
      type: object
      required: [checkin_id, user_id, court_id, status, checkin_date]
      properties:
        checkin_id: { type: integer, readOnly: true }
        user_id: { type: integer }
        court_id: { type: integer }
        status: { type: string, enum: ['Буду сегодня', 'Не смогу'] }
        checkin_date: { type: string, format: date }

    # ---- Trainer
    TrainerCreate:
      type: object
      required: [display_name, specialization, experience_years, price_per_hour, contact_info]
      properties:
        display_name: { type: string, example: Алексей Смирнов }
        about: { type: string }
        specialization: { type: string, example: Бросок и работа с мячом }
        experience_years: { type: integer, minimum: 0 }
        price_per_hour: { type: number, minimum: 0, example: 1500 }
        contact_info: { type: string, example: '@alex_coach' }

    TrainerPublic:
      allOf:
        - $ref: '#/components/schemas/TrainerCreate'
        - type: object
          required: [trainer_profile_id, user_id, is_active]
          properties:
            trainer_profile_id: { type: integer, readOnly: true }
            user_id: { type: integer }
            is_active: { type: boolean }
            average_rating:
              type: number
              nullable: true
              readOnly: true
              description: Средняя оценка (1-5), null если оценок нет

    # ---- Trainer rating
    TrainerRatingCreate:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }

    TrainerRatingPublic:
      allOf:
        - $ref: '#/components/schemas/TrainerRatingCreate'
        - type: object
          required: [rating_id, trainer_profile_id, user_id]
          properties:
            rating_id: { type: integer, readOnly: true }
            trainer_profile_id: { type: integer }
            user_id: { type: integer }
            created_at: { type: string, format: date-time, readOnly: true }